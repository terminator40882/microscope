<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mikroskop</title>
  </head>
  <body>
    <video id="cameraVideo" playsinline muted aria-hidden="true"></video>
    <canvas id="previewCanvas"></canvas>

    <button id="menuButton" class="ctl ctl-menu" aria-label="Menü" aria-expanded="false" aria-controls="menu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>

    <button id="captureButton" class="ctl ctl-shutter" aria-label="Auslösen" hidden><span></span></button>

    <button id="installButton" class="install" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M4 19h16" /></svg>
      <span>Installieren</span>
    </button>

    <button id="startButton" class="ctl ctl-start" aria-label="Kamera starten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3.2l1.6-2.2h6.4L16.8 8H20v11H4z" /><circle cx="12" cy="13.5" r="3.6" /></svg>
    </button>

    <div id="menu" class="menu" role="dialog" aria-label="Einstellungen" hidden>
      <label class="row">
        <span>Kamera</span>
        <select id="cameraSelect" disabled></select>
      </label>

      <label class="row">
        <span>Zoom<em id="zoomValue">1,0×</em></span>
        <input id="zoomRange" type="range" min="1" max="8" step="0.1" value="1" disabled />
      </label>

      <label class="row">
        <span>Fokus</span>
        <select id="focusMode" disabled></select>
      </label>

      <label class="row" id="focusDistanceRow" hidden>
        <span>Distanz<em id="focusValue"></em></span>
        <input id="focusRange" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
    </div>

    <output id="toast" class="toast" aria-live="polite"></output>
    <script src="./app.js" type="module"></script>
  </body>
</html>
